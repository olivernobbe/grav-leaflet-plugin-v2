name: Map Marker Leaflet V2
version: 2.0.0-beta.15
description: Grav 2 map shortcodes using Leaflet 2 ES modules and configurable markers
icon: map
author:
  name: Oliver Nobbe
  email: grav-leaflet-v2@nobbe.eu
homepage: https://github.com/olivernobbe/grav-leaflet-plugin-v2
keywords: grav, plugin, map, markers, leaflet, openstreetmap, thunderforest, mapbox, opensource
bugs: https://github.com/olivernobbe/grav-leaflet-plugin-v2/issues
docs: https://github.com/olivernobbe/grav-leaflet-plugin-v2
license: MIT

dependencies:
    - name: grav
      version: '>=2.0.0-beta.1'
    - name: shortcode-core

form:
    fields:
        enabled:
            type: toggle
            label: Plugin status
            highlight: 1
            default: 0
            options:
                1: Enabled
                0: Disabled
            validate:
                type: bool
        provider:
            type: select
            label: Map imagery provider
            options:
                openstreetmap: "Open Street Map"
                thunderforest: Thunderforest
                mapbox: Mapbox
                carto: Carto
            default: openstreetmap
        preffered:
            type: number
            label: Provider variant index (legacy preffered)
            help: Zero-based index in providers.<provider>.variants. The available variants depend on the selected provider configuration; shortcode variant overrides this setting.
            default: 0
            validate:
                type: int
                min: 0
        variant_reference:
            type: display
            content: >
                <p><strong>Standard variants (zero-based indices):</strong></p>
                <ul>
                <li>OpenStreetMap: one standard layer; no variant list.</li>
                <li>Thunderforest: 0 cycle, 1 transport, 2 landscape, 3 outdoors, 4 transport-dark, 5 spinal-map, 6 pioneer, 7 mobile-atlas, 8 neighbourhood.</li>
                <li>Mapbox: 0 Streets, 1 Outdoors, 2 Light, 3 Dark, 4 Satellite.</li>
                <li>CARTO: 0 light_all, 1 light_nolabels, 2 dark_all, 3 dark_nolabels, 4 voyager, 5 voyager_nolabels, 6 voyager_labels_under.</li>
                </ul>
                <p>These are the plugin's built-in configuration values, not a guarantee that each style is currently available from its provider. Inherited or custom values in <code>providers.&lt;provider&gt;.variants</code> can change the index order.</p>
        providers.thunderforest.apikey:
            type: text
            label: Thunderforest API key
            help: Stored only in your local plugin configuration. Sent to the tile provider by the browser.
        providers.mapbox.apikey:
            type: text
            label: Mapbox public access token
            help: Use a public pk. token. Variant indices 0 Streets, 1 Outdoors, 2 Light, 3 Dark, 4 Satellite.
        providers.carto.apikey:
            type: text
            label: CARTO Basemaps API key
            help: Required for CARTO basemaps. Sent to CARTO in tile requests; restrict it to your website's referrer in your CARTO dashboard.
